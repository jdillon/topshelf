language: 'typescript'
tags: ['package']

toolchain:
  default: 'bun'

tasks:
  build:
    command: 'tsc --build'
    inputs:
      - '@globs(sources)'
    outputs:
      - 'dist'
  typecheck:
    command: 'tsc --noEmit'
    inputs:
      - '@globs(sources)'
  lint:
    command: 'eslint src/'
    inputs:
      - '@globs(sources)'
  clean:
    command: 'rm -rf dist'
